name: Render Keep-Alive

on:
  schedule:
    - cron: "*/20 * * * *"  # every 20 minutes — GitHub's scheduler can lag
                             # a few minutes under load, which is fine here;
                             # Render's free tier sleeps after ~15 min idle
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.BACKEND_URL }}/health")
          echo "Health check returned status $response"
          if [ "$response" -ne 200 ]; then
            echo "::warning::Backend health check failed with status $response"
          fi